llm:
  base_url_env: OPENAI_BASE_URL
  base_url_default: "https://opencode.ai/zen/go/v1"
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  model_default: deepseek-v4-flash
  timeout: 60
  temperature: 0.9
task:
  timeout_seconds: 600
  train_datasets: [datasets/admissible/train/asp_train.pkl]
  train_instances: 32
  return_list: true
hidden_test:
  id_datasets: [datasets/admissible/id/asp_id.pkl]
  ood_datasets: [datasets/admissible/ood/asp_ood.pkl]
  id_eval_instances: 32
  ood_eval_instances: 3
  instances_per_size:
    id: 32
    ood: 24
  function_timeout_seconds: 21600
  speed_probe_timeout_seconds: 0
profiler:
  log_dir: logs/admissible/eohs
  log_style: simple
method:
  max_sample_nums: 500
  max_generations: 1000
  pop_size: 10
  num_samplers: 4
  num_evaluators: 4
  debug_mode: false
