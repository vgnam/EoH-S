llm:
  base_url_env: OPENAI_BASE_URL
  base_url_default: "https://opencode.ai/zen/go/v1"
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  model_default: deepseek-v4-flash
  timeout: 60
task:
  timeout_seconds: 120
  train_datasets: [datasets/obp/dataset_obp_train_size500.pkl]
  train_n_instances: 64
  return_list: true
hidden_test:
  id_datasets: [datasets/obp/dataset_obp_hidden_id_size200.pkl, datasets/obp/dataset_obp_hidden_id_size500.pkl, datasets/obp/dataset_obp_hidden_id_size1000.pkl]
  ood_datasets: [datasets/obp/dataset_obp_hidden_ood_size200.pkl, datasets/obp/dataset_obp_hidden_ood_size500.pkl, datasets/obp/dataset_obp_hidden_ood_size1000.pkl]
  sizes: [200, 500, 1000]
  instances_per_size: 128
  function_timeout_seconds: 60
  speed_probe_timeout_seconds: 0
profiler:
  log_dir: examples/training/obp_set/logs/eoh
  log_style: simple
method:
  max_sample_nums: 500
  max_generations: 1000
  pop_size: 10
  num_samplers: 4
  num_evaluators: 4
  debug_mode: false
