llm:
  base_url_env: OPENAI_BASE_URL
  base_url_default: "https://opencode.ai/zen/go/v1"
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  model_default: deepseek-v4-flash
  timeout: 60
  temperature: 0.9
logger:
  root: examples/training/bp_1d_construct/logs/ow_cahd
stream:
  datasets: [code/llm4ad/task/optimization/bp_1d_construct/train_datasets/size_100.pkl]
  seed: 2026
  batch_size: 32
  shuffle: true
method:
  portfolio_size: 10
  min_sleep_per_regime: 4
  novelty_alpha: 0.01
  novelty_confirm_rounds: 2
  skip_mmd_verification: true
  auto_accept_regime: false
  always_synthesize_regime: true
  allow_bootstrap_fallback: true
  llm_synthesis_examples: 4
  llm_synthesis_min_successful_components: 1
  covariance_reg: 0.0001
  belief_floor: 0.02
  max_generations: 8
  pop_size: 10
  num_samplers: 1
  num_evaluators: 1
  debug_mode: false
  print_eohs_samples: true
  sleep_instances_per_round: 16
  fit_samples_per_regime: 32
  llm_synthesis_mixture_components: 8
  llm_synthesis_temperatures: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1]
  max_sample_nums: 500
  synthesis_context: "Constructive 1D bin packing with bin capacity fixed at 100. Each generated instance must be a plain Python list of integer item weights in [1, 100] with between 100 and 2000 items. The runner adds the fixed capacity 100."
hidden_test:
  id_datasets: [code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_100.pkl, code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_500.pkl, code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_1000.pkl, code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_2000.pkl]
  ood_datasets: [code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_100.pkl, code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_500.pkl, code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_1000.pkl, code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_2000.pkl]
  sizes: [100, 500, 1000, 2000]
  instances_per_size: 64
  eval_instances: 32
  function_timeout_seconds: 1200
  speed_probe_timeout_seconds: 0
