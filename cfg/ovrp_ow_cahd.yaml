llm:
  base_url_env: OPENAI_BASE_URL
  base_url_default: "https://opencode.ai/zen/go/v1"
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  model_default: mistral-large-latest
  timeout: 300
  temperature: 0.9
  max_retries: 5
logger:
  root: logs
stream:
  datasets: [code/llm4ad/task/optimization/ovrp_construct/train_datasets/family_uniform.pkl, code/llm4ad/task/optimization/ovrp_construct/train_datasets/family_cluster.pkl, code/llm4ad/task/optimization/ovrp_construct/train_datasets/family_bezier.pkl, code/llm4ad/task/optimization/ovrp_construct/train_datasets/family_grid_holes.pkl]
  seed: 2026
  batch_size: 16
  shuffle: true
method:
  portfolio_size: 10
  min_sleep_per_regime: 4
  novelty_alpha: 0.01
  novelty_confirm_rounds: 2
  skip_mmd_verification: true
  auto_accept_regime: false
  always_synthesize_regime: true
  allow_bootstrap_fallback: true
  llm_synthesis_examples: 4
  llm_synthesis_min_successful_components: 1
  covariance_reg: 0.0001
  belief_floor: 0.02
  max_generations: 8
  pop_size: 10
  num_samplers: 1
  num_evaluators: 1
  debug_mode: false
  print_eohs_samples: true
  sleep_instances_per_round: 16
  fit_samples_per_regime: 32
  llm_synthesis_mixture_components: 8
  llm_synthesis_temperatures: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1]
  max_sample_nums: 500
  synthesis_context: "Open vehicle routing problem (OVRP). Each generated instance must be a numpy array of node coordinates with shape (n_cities, 2), n_cities between 21 and 201; the depot is row 0 and the remaining rows are customers. Coordinates must be finite and lie roughly in [0, 1]. Return only the coordinates — the runner deterministically derives customer demands, vehicle capacity, and the distance matrix from them."
hidden_test:
  id_datasets: [code/llm4ad/task/optimization/ovrp_construct/test_datasets/size_20.pkl, code/llm4ad/task/optimization/ovrp_construct/test_datasets/size_50.pkl, code/llm4ad/task/optimization/ovrp_construct/test_datasets/size_100.pkl]
  ood_datasets: [code/llm4ad/task/optimization/ovrp_construct/ood_test_datasets/mixture/size_20.pkl, code/llm4ad/task/optimization/ovrp_construct/ood_test_datasets/mixture/size_50.pkl, code/llm4ad/task/optimization/ovrp_construct/ood_test_datasets/mixture/size_100.pkl]
  sizes: [20, 50, 100]
  instances_per_size: 128
  eval_instances: 128
  function_timeout_seconds: 300
  speed_probe_timeout_seconds: 0