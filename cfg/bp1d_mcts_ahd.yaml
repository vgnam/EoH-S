llm:
  base_url_env: OPENAI_BASE_URL
  base_url_default: "https://opencode.ai/zen/go/v1"
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  model_default: deepseek-v4-flash
  timeout: 60
  temperature: 0.9
task:
  timeout_seconds: 600
  train_datasets: [code/llm4ad/task/optimization/bp_1d_construct/train_datasets/size_100.pkl]
  train_instances_per_dataset: 64
  return_list: true
hidden_test:
  id_datasets: [code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_100.pkl, code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_500.pkl, code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_1000.pkl, code/llm4ad/task/optimization/bp_1d_construct/test_datasets/size_2000.pkl]
  ood_datasets: [code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_100.pkl, code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_500.pkl, code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_1000.pkl, code/llm4ad/task/optimization/bp_1d_construct/ood_test_datasets/mixture/size_2000.pkl]
  sizes: [100, 500, 1000, 2000]
  instances_per_size: 64
  eval_instances: 32
  function_timeout_seconds: 1200
  speed_probe_timeout_seconds: 0
profiler:
  log_dir: logs/bp1d/mcts_ahd
  log_style: simple
method:
  max_sample_nums: 500
  init_size: 10
  pop_size: 10
  num_samplers: 4
  num_evaluators: 4
  alpha: 0.5
  lambda_0: 0.1
  debug_mode: false
